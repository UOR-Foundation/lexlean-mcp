[package]
name = "gateway-vectors"
description = "Sends the requests of gateway/vectors/generate.py through the committed core and the binding, and prints the response and the effects of each."
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
gateway-host = { path = "../../gateway-host" }
gateway-binding = { path = "../../bindings/gateway-binding" }
serde_json = "1"

[lints.rust]
missing_docs = "deny"

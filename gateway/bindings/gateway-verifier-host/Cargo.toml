[package]
name = "gateway-verifier-host"
description = "The verifier host of the LexLean MCP gateway: the program that starts one verifier process for each task, and ends what it leaves."
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[[bin]]
name = "gateway-verifier-host"
path = "src/bin/gateway-verifier-host.rs"

[dependencies]
rustix = { version = "1", features = ["process"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
missing_docs = "deny"

[package]
name = "gateway-binding"
description = "The host of the LexLean MCP gateway: the store, the Engine, the verifier, the lexicon and the attestations, as the ten effects of src/Effects.lex.tex."
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[[bin]]
name = "gateway-provision"
path = "src/bin/gateway-provision.rs"

[[bin]]
name = "gateway-verifier"
path = "src/bin/gateway-verifier.rs"

[dependencies]
gateway-host-api = { path = "../../gateway-host-api" }
gateway-signer = { path = "../gateway-signer" }
lexlean = "0.3.0"
serde_json = "1"
camino = "1"
sha2 = "0.10"
rustix = { version = "1", features = ["process", "rand"] }

[dev-dependencies]
tempfile = "3"
ed25519-dalek = "2"
base64 = "0.22"

[lints.rust]
missing_docs = "deny"

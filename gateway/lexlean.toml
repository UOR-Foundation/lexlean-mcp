spec = "lexlean/project/1"
name = "lexlean-mcp-gateway"
language = "1.2"
module_prefix = "LexLeanMcpGateway"
source_roots = ["mcp/src", "src"]
entrypoints = ["src/Effects.lex.tex"]
build_root = ".lexlean"
lockfile = "lexlean.lock"
lean_workspace = "."
lean_toolchain = "leanprover/lean4:v4.32.1"

[[lexicon_source]]
package = "lexlean.std.bool"
kind = "builtin"

[[lexicon_source]]
package = "lexlean.std.nat"
kind = "builtin"

[[lexicon_source]]
package = "lexleanmcp.titles"
kind = "path"
path = "language/lexleanmcp.titles"

[[lexicon_source]]
package = "mcp.core"
kind = "path"
path = "language/mcp.core"

[[lexicon_source]]
package = "prism.arch"
kind = "path"
path = "language/prism.arch"

[limits]
max_file_bytes = 33554432
max_total_source_bytes = 67108864
max_primitive_atoms = 2000000
max_token_lattice_edges = 4000000
max_parse_states = 4000000
max_ir_nodes = 2000000
max_scope_depth = 1024
max_import_depth = 128
max_diagnostics = 256
max_child_output_bytes = 16777216
child_timeout_ms = 300000

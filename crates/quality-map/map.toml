# crates/quality-map/map.toml --- the API-to-tool map of Q2 (issue #15).
#
# One row per public function of the stable surface of LexLean release/v0.4 at
# 9796067, as the vendored sources in lexlean/ declare it (see sources.toml). A
# function reaches exactly one tool or states why no tool does; the tests (QM-02,
# QM-03) recompute the function list from the vendored sources and fail when a
# row is missing, extra, re-signed, unmapped or mapped to a tool no issue defines.
#
# `Engine::check` is a method, `sdk::assemble` a function of a module. A `reason`
# cites `issue`: the issue of lexlean-mcp it is taken from, or 0 when no issue
# speaks and the reason rests on the pinned SPEC and source.
#
# The in-scope functions are the ones the model of Q2 names in src/Quality.lex.tex;
# a function reaches a tool exactly when it is in scope there.

spec = "lexlean-mcp/api-map/1"
commit = "97960679736e960e84a98f5c43981e1f2c70d6d7"


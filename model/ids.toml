[[id]]
id = "DR-03"
level = "build"
suite = "drafts"
statement = "Path admission in lexlean_draft_write is the exported admission: a path with a .. component, a path that is not .lex.tex, a path that is not NFC, an absolute, empty, dot or empty-component path and a path outside the source roots are each refused with the constructor of Refusal named for it, before store.put and before any Engine call, and the only effect the call asks for is the lexicon.read of the profile record."

[[id]]
id = "DR-04"
level = "build"
suite = "drafts"
statement = "A draft is within draft.max_files 256 and draft.max_bytes 8388608 and has no repeated path: a draft at both limits is written, and one file more, one byte more and a repeated path are refused with TooManyFiles, TooManyBytes and DuplicatePath."

[[id]]
id = "DR-05"
level = "build"
suite = "drafts"
statement = "lexlean_draft_write stores the preimage as the one key <profile>/<identity> of the drafts area, and lexlean_draft_read returns the text of a file of the draft, or the paths and sizes of its files, after checking that the SHA-256 of the stored bytes is the identity of the handle: an unknown draft or a handle that is not <profile>/<64 lower case hexadecimal digits>, a path the draft lacks and a stored draft whose bytes changed or are not a preimage are refused with DraftUnknown, PathUnknown and DraftCorrupt."

[[id]]
id = "DR-06"
level = "build"
suite = "drafts"
statement = "The profile record is read by the first effect of a write: it holds the 64 lower case hexadecimal digits of the profile ID and one source root to a line; an unknown profile is the host failure profile-unknown, and a profile without a record, or a record that is short, long, not lower case hexadecimal, without a root or with a root that is not a relative path of whole components, is refused as ProfileRecordMalformed, with no store.put."

[[id]]
id = "DR-07"
level = "build"
suite = "drafts"
statement = "Materialization copies: an Engine tool whose project is the handle of a draft runs on a directory of the builds area that holds the files of the profile bundle and of the draft as regular files of their own and links nothing, the result equals the result of the same tool on a directory project holding the same files, and a handle whose draft or profile is absent is the host failure project-refused."

[[id]]
id = "DR-08"
level = "build"
suite = "drafts"
statement = "A profile bundle that contains a symbolic link is refused, wherever the link lies (a file, a directory, a dangling link, below a subdirectory) and whatever it points at, as the host failure project-refused, before the Engine is called, and no byte is read through the link."

[[id]]
id = "DR-09"
level = "build"
suite = "drafts"
statement = "The draft tools are three, all within E1 to E10: lexlean_draft_write asks lexicon.read and then store.put, lexlean_draft_read asks one store.get, and lexlean_draft_assemble asks lexicon.read, a store.get of the base draft when it names one, a store.put whose form renders the module and a store.put of the draft; each has a closed input schema, the set of effects is the model's ten, and the exchange budget of the gateway is the four that assemble needs."

[[id]]
id = "DR-10"
level = "build"
suite = "drafts"
statement = "Every refusal of the draft tools is typed and has a negative test: ten constructors of Admission.Refusal, ProfileRecordMalformed, DraftUnknown, PathUnknown and DraftCorrupt are each the refusal of one test, the eleventh constructor NotUtf8 is reached only by octets that the JSON reader refuses before any tool runs, which a test shows (the constructor itself is DL-03's), and the host failures profile-unknown, key-refused and project-refused are each the failure of one."

[[id]]
id = "DR-11"
level = "build"
suite = "drafts"
statement = "Each gate of the draft tools rejects its planted defect: a .. path admitted, a symbolic link followed in a profile bundle and a draft identity that ignores the profile; DRAFTS.md records the command, the diagnostic and the restore of each."

[[id]]
id = "DR-12"
level = "build"
suite = "drafts"
statement = "lexlean_draft_read with the view data answers the module of a file of the draft as sdk::read_module reads it, and with the view spans the byte ranges of its declarations as sdk::declaration_spans gives them (null for a module written as data), each through one store.get whose view is 1 or 2 and whose path is the file; the text of the result is the JSON that the sdk function gave for the stored text of the file, and without a view the file is read as text through the view 0."

[[id]]
id = "DR-13"
level = "build"
suite = "drafts"
statement = "lexlean_draft_assemble makes a new draft whose file at the path holds exactly the bytes that sdk::assemble returns for the header, the kind and the data given (a semantic, tooling or core module), or exactly the bytes that sdk::write_module returns for the text of that file in the base draft and the data given, rendered by the host through the form 1 or 2 of store.put; the other files of the base are kept, the draft is named by its identity over the bytes stored, and the Engine checks it."

[[id]]
id = "DR-14"
level = "build"
suite = "drafts"
statement = "A prose document is stored and read as text and never reaches the sdk: lexlean_draft_write stores any .lex.tex text with the form 0, lexlean_draft_read without a view returns its bytes through a store.get of the view 0, a kind other than semantic, tooling and core is refused by the schema of lexlean_draft_assemble, and asking a prose document for the view data or spans is the typed refusal ModuleRefused."

[[id]]
id = "DR-15"
level = "build"
suite = "drafts"
statement = "An unknown value of a closed field is a typed refusal with a negative test: a view of store.get outside 0 to 2 is the host failure view-unknown and a form of store.put outside 0 to 2 is form-unknown, each reads or stores nothing and does not reach the sdk, and a class outside 0 to 2 in an answer is the malformed outcome of the core; the refusal of a module by the sdk is ModuleRefused with its message, a rewrite of a path that the base lacks is PathUnknown, a base of another profile than the one named is ProfileMismatch, and each has a negative test."

[[id]]
id = "DR-16"
level = "build"
suite = "drafts"
statement = "Each gate of the assemble work rejects its planted defect: an unknown view admitted, an assembled module whose bytes differ from those of sdk::write_module and a prose document sent through the sdk; DRAFTS.md records the command, the diagnostic and the restore of each."

[[id]]
id = "VO-01"
level = "build"
suite = "vocabulary"
statement = "The profile ID that the host computes is Identity.profileId: the host's encoder reproduces the model's profilePreimageVector, profileIdVector and profileFramingReviewsVector byte for byte, gateway/vectors/generate.py computes the ID of the vectors' profile again in Python and the host agrees, and the toolchain of the preimage is the compiler-semantics ID and the Lean toolchain of the lock that lock --check has just accepted."

[[id]]
id = "VO-02"
level = "build"
suite = "vocabulary"
statement = "Changing any file of a provisioned profile changes the profile ID the host records: a byte of lexlean.toml, of lexlean.lock, of a file of a local lexicon package or of an artifact_source file, a renamed profile file, an added one, a removed one and a review record each give another ID, while a file under a source root leaves it alone."

[[id]]
id = "VO-03"
level = "build"
suite = "vocabulary"
statement = "The language rule of the gateway is the model's and not a second copy: gateway/src/ProfileLanguage.lex.tex holds PackageCheck, PackageDecl, languageMismatchCode, checkPackage and checkPackages byte for byte as src/Profiles.lex.tex declares them, the model carries them as executable, and a test compares the text of each declaration."

[[id]]
id = "VO-04"
level = "build"
suite = "vocabulary"
statement = "A package of another language is refused with LLC0103 at every place it could enter: install refuses a project whose lexicon package has another language with the compiler's own LLC0103 and installs nothing, and a catalogue or a vocabulary that holds such a package is not served, lexlean_profiles lists the profile under refused with LLC0103 and not among profiles, lexlean_lexicon_search and the read of its resources are refused with LanguageMismatch and the code LLC0103, and none of its entries is returned."

[[id]]
id = "VO-05"
level = "build"
suite = "vocabulary"
statement = "Provisioning is an operator command of the binding and not an effect: gateway-provision init and lock run lexlean init and lexlean lock in process, --allow-network is accepted by lock alone, install never writes the lock (a stale lock is the compiler's LLC0102 and a missing lock is refused), no tool of the gateway locks, initialises or installs, and the set of effects is still the model's ten."

[[id]]
id = "VO-06"
level = "build"
suite = "vocabulary"
statement = "A package that enters from a path or from Git needs a review record before a profile is installed (K2, and the measurement of risk 2 that SECURITY.md executes): a record is four lines (lexlean-mcp-review-v1, package ID@VERSION, tree_sha256 and the digest, reviewer and a name), install refuses a locked path or Git package that no record names with ReviewMissing, a record that is not four such lines with ReviewMalformed, a record that names no locked package or another tree digest than the lock's with ReviewStale and a record given twice with ReviewDuplicate, a builtin package needs none, and the bytes of every record enter the profile ID and are stored as reviews/<SHA-256 of the record>."

[[id]]
id = "VO-07"
level = "build"
suite = "vocabulary"
statement = "install lays out the profile as one rename into the profiles area and leaves the store as it was when it refuses: profiles/<name> holds the project as locked (not .git, .lake, or .lexlean but its Git package cache), the record profile, the derived vocabulary and the reviews, the catalogue index/profiles lists it, a name that is not a valid key segment is NameInvalid, a name already installed is ProfileExists, a project with a symbolic link is LinkInBundle, a top-level entry named profile, vocabulary or reviews is ReservedEntry, a project with source packages is SourcePackagesUnsupported, and materialization (DR-07) copies the bundle without the record, the vocabulary and the reviews."

[[id]]
id = "VO-08"
level = "build"
suite = "vocabulary"
statement = "The vocabulary is the entries of the packages that the compiler resolved for the project, as lexlean::lock::resolve_packages loads them: the document lists each locked lexicon package with its version, its language and its number of entries, and the entries in package and local ID order each with its package, version, category, frame, arity, denotation and forms, an entry that denotes a module the source roots of the profile lack is left out, and a vocabulary over 1 MiB (the bound of lexicon.read) is VocabularyTooLarge."

[[id]]
id = "VO-09"
level = "build"
suite = "vocabulary"
statement = "lexlean_profiles takes an optional profile and asks one store.get of the key profiles of the index area: it answers every installed profile with its name, ID, language, source roots and packages (package, version, language, entries), a named profile that is not installed is ProfileUnknown, a catalogue that is not the layout is CatalogueMalformed, a profile whose packages are not all of its language is under refused with the code LLC0103, an absent catalogue is no profile, and the input schema is closed."

[[id]]
id = "VO-10"
level = "build"
suite = "vocabulary"
statement = "lexlean_lexicon_search takes a profile, an optional query (matched against the entry ID and the spelling of every form without regard to ASCII case), an optional package, an offset and a limit of at most 100, asks one lexicon.read of the entry vocabulary and answers total, offset and the entries of the page in vocabulary order; an unknown profile is the host failure profile-unknown, a profile without a vocabulary is VocabularyMissing, a vocabulary that is not the layout is VocabularyMalformed, and the input schema is closed."

[[id]]
id = "VO-11"
level = "build"
suite = "vocabulary"
statement = "The resource template lexlean://profiles/{profile}/lexicon/{package}@{version} is served with cacheScope public and the owner's cache.ttl_ms: resources/templates/list answers it with no effect, resources/list answers one resource for every package of every installed profile with one store.get, and resources/read of a URI of the template asks one lexicon.read of the vocabulary and answers the entries of that package as application/json text; a URI that is not of the template, a profile that is not installed and a package or version the profile lacks are the protocol error -32602 with the URI, and a package of another language is refused as in VO-04."

[[id]]
id = "VO-12"
level = "build"
suite = "vocabulary"
statement = "completion/complete of the reference ref/resource of the template completes the argument profile from the installed profiles and the argument package from the packages of the profile that context.arguments.profile names (from all installed profiles when it names none), by prefix and at most 100 values with total and hasMore as MCP's Resources.completionOf computes them; another reference, another argument name and a profile that is not installed in the context are the protocol error -32602 or no value as stated by the tests, and the call asks one store.get."

[[id]]
id = "VO-13"
level = "build"
suite = "vocabulary"
statement = "The capabilities the gateway declares are those it serves and no others: server/discover declares tools, resources and completions, a method of each is answered, prompts and the tasks methods are not declared and are answered as before, gateway/waiting.json names exactly the scenarios of MCP's server suite that still fail with a reason that is true of this gateway, and GATEWAY-CONFORMANCE.md is that table."

[[id]]
id = "VO-14"
level = "build"
suite = "vocabulary"
statement = "An Atlas profile serves all 293 entries through the tools and the resource template: the project examples/uor-atlas of the pinned LexLean installs as a profile of language 1.0 with its 86 core modules in its source root, lexlean_profiles lists lexlean.uor.atlas 1.0.0 with 293 entries, lexlean_lexicon_search pages through exactly the 293 entry IDs of the model's atlasEntries, and resources/read of the Atlas package returns the same 293 entries; a profile without the module Atlas serves none of them."

[[id]]
id = "VO-15"
level = "build"
suite = "vocabulary"
statement = "Every refusal of provisioning and of the vocabulary tools is typed and has a negative test: the constructors of provision::Refusal (NameInvalid, ProfileExists, ProjectUnreadable, Compiler, LinkInBundle, ReservedEntry, SourcePackagesUnsupported, ReviewMissing, ReviewMalformed, ReviewStale, ReviewDuplicate, VocabularyTooLarge, IdentityRefused, StoreUnwritable), the tool refusals ProfileUnknown, CatalogueMalformed, VocabularyMissing, VocabularyMalformed and LanguageMismatch, the host failures profile-unknown and key-refused of lexicon.read, the invalid arguments of the two tools, and the protocol error -32602 of a resource that is not found and of a completion that is not served."

[[id]]
id = "VO-16"
level = "build"
suite = "vocabulary"
statement = "Each gate of the profile work rejects its planted defect: a profile file excluded from the identity, a mixed-language package admitted, an Atlas entry missing from the served lexicon, a capability declared that is not served, a profile installed without a review record and a reserved entry copied into a project; PROFILES.md records the command, the diagnostic and the restore of each."

[[id]]
id = "SG-01"
level = "build"
suite = "signing"
statement = "The signer writes the DSSE envelope of a verification: the payload type is application/vnd.in-toto+json, the payload is the base64 of an in-toto Statement v1 whose one subject is attestation.json with the SHA-256 of the bytes the signer was given and whose predicate type is https://uor.foundation/lexlean-mcp/verification/v1 with the predicate the caller supplied, and there is one signature, whose keyid is the SHA-256 in hexadecimal of the public key and whose sig is the Ed25519 signature over PAE(payloadType, payload)."

[[id]]
id = "SG-02"
level = "build"
suite = "signing"
statement = "The primitives are the standards': PAE reproduces the example of the DSSE protocol (DSSEv1 29 http://example.com/HelloWorld 11 hello world), the Ed25519 key that the signer derives from the seed of RFC 8032 section 7.1 test 1 has that test's public key and signs that test's empty message with that test's signature, and two envelopes made from equal inputs are equal to the byte because Ed25519 is deterministic."

[[id]]
id = "SG-03"
level = "build"
suite = "signing"
statement = "validate accepts the envelope the signer wrote, given a key history that holds its key and the bytes of the subject, and returns the statement: it checks the signature with the key the history names by the keyid (strict verification), the payload type, the statement type, the predicate type and that the subject digest is the SHA-256 of the bytes it was given."

[[id]]
id = "SG-04"
level = "build"
suite = "signing"
statement = "Every refusal of an envelope is typed and has a negative test: the constructors of EnvelopeError (Malformed, PayloadType, Payload, Statement, NoSignature, UnknownKey, BadSignature, KeyRevoked, SubjectMismatch) are each reached by a planted envelope --- not JSON, a payload type changed, a payload that is not base64, a statement of another type or predicate, no signatures, a keyid the history lacks, a flipped signature byte or payload byte, a revoked key and a subject of other bytes --- and none of them is accepted."

[[id]]
id = "SG-05"
level = "build"
suite = "signing"
statement = "The key history is appended by the signer and read back: the first signature with a key adds {keyid, algorithm Ed25519, public_key, not_before}, further signatures with it add nothing, a second key adds its own entry and the envelopes of the first still validate (rotation), revoke sets revoked_at so that the envelopes of that key fail with KeyRevoked while those of the other key still validate and the revoked key itself signs nothing (SignError::KeyRevoked), and a history that is not a list of well-formed entries is refused with HistoryError::Malformed."

[[id]]
id = "SG-06"
level = "build"
suite = "signing"
statement = "The key is a file secret: Signer::load reads 64 hexadecimal digits, with surrounding whitespace allowed, as the Ed25519 seed; a missing file is KeyError::Missing, an unreadable one KeyError::Unreadable and a file of any other content KeyError::Malformed; and neither the seed nor any part of it appears in the Debug output of the signer or of a KeyError, in an envelope or in the history."

[[id]]
id = "SG-07"
level = "build"
suite = "signing"
statement = "A signature that cannot be recorded is not returned: when the history cannot be written, sign returns SignError::History and no envelope; the history is written to a temporary file and renamed over the old one, so a reader sees the old list or the new one and no partial list, and no temporary file is left after a success."

[[id]]
id = "SG-08"
level = "build"
suite = "signing"
statement = "Each gate of the signer rejects its planted defect: the lengths of PAE swapped, the keyid taken from the seed instead of the public key, the digest of the subject not checked, a revoked key accepted, and the history not appended on the first use of a key; SIGNING.md records the command, the diagnostic and the restore of each."

[[id]]
id = "SG-09"
level = "build"
suite = "signing"
statement = "A verification is not started without a signer whose key loads: the host reads the socket of the signer from LEXLEAN_MCP_SIGNER (an empty value is no path), reads the key history from the keys area of the store, and verify.start fails with verifier-unavailable, starts no task, runs no verification and leaves nothing in the builds area when no signer is configured, when none answers at the socket and when the key file of the signer is missing, unreadable or malformed, while a project that is not one is refused as project-refused whatever the state of the key."

[[id]]
id = "SG-10"
level = "build"
suite = "signing"
statement = "A verification that ends verified leaves a record that is a signed envelope: verifications/<attestation ID>.json is the DSSE envelope, verifications/<attestation ID>/attestation.json is the attestation.json of the verified directory byte for byte, the envelope validates against keys/history with those bytes, its predicate carries the attestation, build, source and semantic IDs, the status verified, the modules and the SHA-256 of each source file, and the result of the task names the key."

[[id]]
id = "SG-11"
level = "build"
suite = "signing"
statement = "attestation.lookup returns the signed envelope: by attestation ID and by the SHA-256 of a source file the verification covered, the lookup of a concluded verification returns exactly the bytes of the envelope in the store, and those bytes validate against keys/history and the stored attestation.json."

[[id]]
id = "SG-12"
level = "build"
suite = "signing"
statement = "A verification that cannot be signed leaves no record: when the key's history cannot be written, or the attestation.json of the verified directory cannot be read, the task ends failed with class 5, and the store holds no envelope, no attestation.json and no index entry for it; a verification that failed leaves none either."

[[id]]
id = "SG-13"
level = "build"
suite = "signing"
statement = "Each gate of the signed record rejects its planted defect: verify.start accepting a verification without a key, the failure to sign ignored and an unsigned record written, the envelope stored without its attestation.json, the predicate without the digests of the source files, and the lookup answering the unsigned record again; SIGNING.md records the command, the diagnostic and the restore of each."

[[id]]
id = "SG-14"
level = "build"
suite = "signing"
statement = "A verified record keeps the evidence its attestation.json binds: below verifications/<attestation ID>/ the store holds build-manifest.json, the manifest whose SHA-256 attestation.json names as build_manifest, each output of kind tex that the manifest names (the canonical LaTeX of a module) at its path, and each input of kind source at sources/<its path>, every file byte for byte with the digest the manifest gives, written after attestation.json and before the envelope; a real verification of the tiny project leaves such a record."

[[id]]
id = "SG-15"
level = "build"
suite = "signing"
statement = "A verification whose evidence cannot be kept whole leaves no record: when the build manifest is missing or is not the one attestation.json names, attestation.json names no manifest, a rendering or a source file is missing or differs from the digest the manifest gives, the manifest names no rendering or no source, or a path the manifest names is not a key of the store, the task ends failed with class 5 and the store holds no envelope, no attestation.json, no evidence, no index entry and no key entry for it."

[[id]]
id = "SG-16"
level = "build"
suite = "signing"
statement = "The signer is a program of its own and the only holder of the key: gateway-signer reads the key file from LEXLEAN_MCP_SIGNING_KEY at each request and answers on the Unix socket LEXLEAN_MCP_SIGNER with mode 0600, it writes the key history below LEXLEAN_MCP_STORE, the crate that holds it links no compiler and no generated package, and the host has no configuration for a key, loads none and links no signature library outside its tests, so that a key named in the environment of the host signs nothing."

[[id]]
id = "SG-17"
level = "build"
suite = "signing"
statement = "An envelope made through the socket is the envelope the signer makes: its bytes equal those of the signer with the same key, subject and predicate, it validates against the history the program wrote, and a key file put right or rotated while the program runs is used at the next request without a restart."

[[id]]
id = "SG-18"
level = "build"
suite = "signing"
statement = "Every failure of the signer service is typed and has a negative test: each refusal travels by its name and comes back as the same SignError, a request that is not one or is over MAX_REQUEST_BYTES is RequestRefused, no answer at the socket and an answer that is not one are Unavailable, a verification whose signer is lost before it concludes leaves no record, and each constructor of StartError stops the program with exit status 2 and a message that holds nothing of the key."

[[id]]
id = "SG-19"
level = "build"
suite = "signing"
statement = "Each gate of the signer service rejects its planted defect: the host loading the key itself, the socket left open to other users, the key cached at the start of the program, a refusal name that comes back as another error, and the bound on a request removed; SIGNING.md records the command, the diagnostic and the restore of each."

[[id]]
id = "VP-01"
level = "build"
suite = "verifier"
statement = "The verifier is a program that speaks lines of JSON: gateway-verifier becomes the leader of a session of its own and says so in a started event that names the session, reads one job line (the directory of the project and the selection) from its standard input, runs Engine::verify and prints one verdict --- verified with the IDs, the modules and the verified directory, failed with the class and the diagnostics of the engine, or cancelled with the groups it ended and those it could not end --- on a line of its standard output; a line cancel on its standard input ends every live child group of the process, the end of that input ends them and the process, and a job line that is not a job is a failed verdict of class 5."

[[id]]
id = "VP-02"
level = "build"
suite = "verifier"
statement = "Each task runs in a process of its own that does not hold the key: verify.start starts the program of the configuration (LEXLEAN_MCP_VERIFIER, else gateway-verifier beside the running executable) with the width and the memory of the owner values in LEXLEAN_VERIFY_WIDTH and LEXLEAN_VERIFY_MEMORY_KIB, without LEXLEAN_MCP_SIGNING_KEY in its environment and with nothing of the seed or of the path of the key file in its arguments, its environment or its input; when the configured program is not a file, verify.start fails with verifier-unavailable, starts no task and leaves nothing in the builds area."

[[id]]
id = "VP-03"
level = "build"
suite = "verifier"
statement = "The tasks run as many at a time as the slots of verify.concurrency allow and the others wait: with one slot the second and the third of three tasks are Queued while the first runs, none fails for waiting, they run in the order they were started and never two at once; with two slots two run at once; and a verification that the process reports verified is signed and recorded by the host with the facts the process printed, in the process of the host."

[[id]]
id = "VP-04"
level = "build"
suite = "verifier"
statement = "A cancel ends one task: a queued task leaves the queue and its process is never started; a running task is sent cancel, the answer carries the groups its process reported, the task ends Cancelled with no record and the other tasks are not touched; a process that reports verified while the cancel is pending leaves no record, because the record is made under the lock that the cancel takes; and a process that does not answer within the grace is killed, together with its session."

[[id]]
id = "VP-05"
level = "build"
suite = "verifier"
statement = "A verifier that is lost leaves nothing: a process that ends without a verdict, by exiting or by a signal, ends its task Failed with class 5 and the result {\"failure\":\"verifier-lost\"} with the tail of its standard error, no record is made, the other tasks are not touched, and every process left in its session --- children that outlived it --- is killed, because LexLean starts its own children with an empty environment, so no marker in the environment can find them."

[[id]]
id = "VP-06"
level = "build"
suite = "verifier"
statement = "Each gate of the verifier process rejects its planted defect: the key left in the environment of the process, a record made for a task that is being cancelled, the session of a lost verifier not killed, the slots ignored so that every task starts at once, and a process that ignores cancel left running; VERIFIER.md records the command, the diagnostic and the restore of each."

[[id]]
id = "VP-07"
level = "build"
suite = "verifier"
statement = "The 32 verify fixtures of AC-07 give the command result of the CLI: for each negative fixture of class #11 in crates/negative-fixtures/register.toml, run in its own environment and, when it carries a toolchain directory, with an elan home that overlays those programs on the pinned toolchain, lexlean_verify and lexlean_verify_control end the task failed with the class equal to the exit status of lexlean verify, and a result equal to the lexlean/command-result/1 the CLI prints on the same bytes, and they leave no record."

[[id]]
id = "TH-01"
level = "build"
suite = "taskhost"
statement = "The gateway declares the entries that the protocol core needs to serve tasks at the pin of MCP: after the ten effects of src/Effects.lex.tex and the frame effect rate.calls at the tag 10, the declaration lists the frame effects clock.now (result ms and iso), task.id (result id) and task.table (result table) at the tags 11 to 13, and the core effect task.store (request table, no result) at the tag 14, which the provider information of the core names as taskStoreTag; the serving frame sections tool_calls, now_ms, now, fresh_task_id and task_table take the fields calls, ms, iso, id and table of those effects, in the order that the frame of the core reads them, and the declaration states the maximums of MCP's own conformance declaration for them."

[[id]]
id = "TH-02"
level = "build"
suite = "taskhost"
statement = "clock.now answers a millisecond counter that never goes back and the same instant as ISO 8601 text in UTC with three digits of milliseconds: the text of 0 is 1970-01-01T00:00:00.000Z, of 1700000000123 is 2023-11-14T22:13:20.123Z, of 951782400000 is 2000-02-29T00:00:00.000Z and of 1709164799999 is 2024-02-28T23:59:59.999Z, and the text of a later answer is the text of the start of the host plus the difference of the counters."

[[id]]
id = "TH-03"
level = "build"
suite = "taskhost"
statement = "task.id answers 32 lowercase hexadecimal digits, a different value at every call and at every host, made from the operating system's source of randomness and not from the clock or from a counter, so that no client can guess the identifier of a task it did not create."

[[id]]
id = "TH-04"
level = "build"
suite = "taskhost"
statement = "task.table answers the bytes that the last task.store gave and nothing before any: a store replaces the whole table, the host hands back exactly what it was given byte for byte, bytes of every value and a table of the 524296 bytes that the declaration allows included, and a store of an empty table empties it."

[[id]]
id = "TH-05"
level = "build"
suite = "taskhost"
statement = "The production core serves the vectors at the pin of MCP with the new frame: every request of gateway/vectors/exchanges.json is answered with the response recorded for it by the core of this commit, the adapter asks for the three frame effects of the time, the identifier and the table once for each request that reaches the core, and an exchange that creates or touches no task asks the core for no task.store."

[[id]]
id = "TH-06"
level = "build"
suite = "taskhost"
statement = "Each gate of the task host rejects its planted defect: the text of the time disagreeing with its counter, an identifier made from the counter, a store that appends to the table instead of replacing it, and a provider that names the wrong tag for the store; TASKHOST.md records the command, the diagnostic and the restore of each."

[[id]]
id = "TH-07"
level = "build"
suite = "taskhost"
statement = "lexlean_verify called by a client that declares the tasks extension creates a task: the core asks verify.start as before, and when the host has started the verification the result is a task handle whose taskId is the task name the verifier gave, in the status working, with a time to live of 86400000 ms and a poll interval of 5000 ms, and the core asks task.store with a table that holds the task as working; a client that does not declare the extension is answered as before, with the task name in the result of the call and no task.store, and a verification that the host refuses to start creates no task."

[[id]]
id = "TH-08"
level = "build"
suite = "taskhost"
statement = "tasks/get on a task the table holds as working asks verify.control once for its status and settles the entry from the answer: queued and running leave it working with no notification, verified and failed complete it with the result of the tool, cancelled cancels it, and a verifier that no longer knows the task fails it with the code -32603; each answer about a task is followed by task.store with the table, and a notification of the new status is streamed before the response only when the task changed; a task that is already terminal is answered from the table without asking verify.control, and a task the table does not hold is the protocol's unknown task."

[[id]]
id = "TH-09"
level = "build"
suite = "taskhost"
statement = "tasks/cancel on a working task asks verify.control to cancel it, answers with the empty acknowledgement, streams a notification of the status cancelled and stores the task as cancelled; asked again, or on a task that is already terminal, it is answered from the table without asking verify.control, and on a task the table does not hold it is the protocol's unknown task."

[[id]]
id = "TH-10"
level = "build"
suite = "taskhost"
statement = "A cancel says what became of the child groups (AC-12): tasks/cancel on a working task settles it with the status message child groups ended: E failed: F, the counts that verify.control gave, which the status notification, a later tasks/get and the table all carry, so a cancel with a group that failed to end is not reported as a clean one."

[[id]]
id = "TH-11"
level = "build"
suite = "taskhost"
statement = "The task path runs with the real verifier and the Lean toolchain: lexlean_verify by a client that declares the tasks extension, polled with tasks/get, ends completed with the state verified, and its record is found by its ID and validates; tasks/cancel while a program of the toolchain runs reports at least one child group ended and none failed, and leaves no record."

[[id]]
id = "TH-12"
level = "build"
suite = "taskhost"
statement = "Calls over the rate are refused (R4): through the generated adapter over a socket with the real host, the first 100 tools/call requests of a window run and the 101st and the 102nd, which rate.tool_calls does not admit, are answered with status 429 without the tool running, while the adapter counted each of them."

[[id]]
id = "TH-13"
level = "build"
suite = "taskhost"
statement = "A draft over a limit fails alone (R4): with the real verifier and the Lean toolchain, lexlean_verify of a project whose module exceeds a limit of its lexlean.toml, by a client that declares the tasks extension, ends completed with an error result of state failed that names LLS8002, while a verification started before it ends verified with its record and the table holds both tasks as completed."

[[id]]
id = "AT-01"
level = "build"
suite = "attestation"
statement = "lexlean_attestation by attestation ID returns the signed envelope: for the record of a concluded verification the tool asks attestation.lookup once and answers found true with the envelope as its text, byte for byte the envelope in the store, and those bytes validate against keys/history and the stored attestation.json."

[[id]]
id = "AT-02"
level = "build"
suite = "attestation"
statement = "lexlean_attestation by the SHA-256 of a source file that the verification covered returns the same envelope as by the attestation ID."

[[id]]
id = "AT-03"
level = "build"
suite = "attestation"
statement = "A lookup that finds nothing is not an error and a malformed value is refused: an attestation ID or a digest that names no record, and an empty store, answer found false with the text not found; a value that is not 64 lowercase hexadecimal digits is the host's refusal value-refused; an empty value is refused by the core as bad arguments and the host is not asked."

[[id]]
id = "AT-04"
level = "build"
suite = "attestation"
statement = "A lookup writes nothing: the store holds the same files with the same bytes after lookups that find, that miss and that are refused."

[[id]]
id = "AT-05"
level = "build"
suite = "attestation"
statement = "Each gate of the tool rejects its planted defect: the lookup reading the file that the envelope signs instead of the envelope, the digest read as an attestation ID, the check of the value dropped, and a lookup that writes to the store; ATTESTATION.md records the command, the diagnostic and the restore of each."

[[id]]
id = "PT-01"
level = "build"
suite = "present"
statement = "lexlean_present by attestation ID returns the attested canonical LaTeX of the record as one embedded resource whose text is the rendering in the store byte for byte, at the uri lexlean://attestation/<ID>/<path of the rendering> with the type application/x-tex, and its structured content is found true, the attestation ID, the path of the rendering and the envelope as JSON, which validates against keys/history and the stored attestation.json; the tool asks attestation.lookup once."

[[id]]
id = "PT-02"
level = "build"
suite = "present"
statement = "AC-06: for the record of nat-add-zero, J1 ends in an embedded resource whose bytes equal the expected canonical LaTeX of the example, and the SHA-256 of those bytes is the digest the attested build manifest names for the rendering."

[[id]]
id = "PT-03"
level = "build"
suite = "present"
statement = "lexlean_present by the SHA-256 of a source file the verification covered returns the same resource as by ID; the argument module, a path of the build manifest, selects one rendering of a record that has several, an empty module is the only rendering of a record that has one, and an empty module on several or a module the manifest does not name is the host's refusal module-unknown."

[[id]]
id = "PT-04"
level = "build"
suite = "present"
statement = "A record that does not exist is found false with the text not found, a value that is not 64 lowercase hexadecimal digits is value-refused, an empty value is refused by the core before the host is asked, and a present writes nothing to the store."

[[id]]
id = "PT-05"
level = "build"
suite = "present"
statement = "The tool presents only what is attested: a rendering of the record that differs from the digest the build manifest names, or a manifest that differs from the digest attestation.json names, is not presented; the host faults and the tool answers an error without the bytes."

[[id]]
id = "PT-06"
level = "build"
suite = "present"
statement = "Each gate of lexlean_present rejects its planted defect: the rendering read from the wrong file, the digest of the rendering not checked, the module not selected, and a present that writes to the store; PRESENT.md records the command, the diagnostic and the restore of each."

[[id]]
id = "EX-01"
level = "build"
suite = "present"
statement = "lexlean_export by attestation ID writes the bundle of the record below exports/<ID>/ and answers found true with the attestation ID and the bundle key exports/<ID>: attestation.json, envelope.json (the envelope in the store), keys.json (the key history), build-manifest.json, each rendering at its path and each source file at sources/<its path>, every file byte for byte as the record holds it; the tool asks attestation.lookup once."

[[id]]
id = "EX-02"
level = "build"
suite = "present"
statement = "J4: a reader checks the bundle offline from its files alone, with the store gone: envelope.json validates against keys.json and attestation.json, the digest of build-manifest.json is the one attestation.json names, and every rendering and source file has the digest the manifest names."

[[id]]
id = "EX-03"
level = "build"
suite = "present"
statement = "The renderings digest of an exported bundle matches the attested build manifest: the SHA-256 of each rendering in the bundle equals the digest of its row of the manifest of the bundle, the bundle holds exactly the renderings and sources the manifest names, and its renderings equal what lexlean_present returns for the record."

[[id]]
id = "EX-04"
level = "build"
suite = "present"
statement = "A record that does not exist, a malformed value and an empty value are answered as for lexlean_present and write nothing; a record whose evidence differs from its digests is refused with a host fault and no file of its bundle is written."

[[id]]
id = "EX-05"
level = "build"
suite = "present"
statement = "An export is repeatable: exporting a record again writes the same bytes, the record itself is not changed, and the bundles of two records are in directories of their own."

[[id]]
id = "EX-06"
level = "build"
suite = "present"
statement = "Each gate of lexlean_export rejects its planted defect: a rendering left out of the bundle, the key history left out, the envelope replaced by attestation.json, and the evidence not checked before the first write; PRESENT.md records the command, the diagnostic and the restore of each."

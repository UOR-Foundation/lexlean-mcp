level = "build"
suite = "profiles"
statement = "A path is under a source root exactly when it is the root, one separator and more: roots match whole components, so src/Main.lex.tex and src/deep/Other.lex.tex are under the root src, while srcs/Main.lex.tex, the path src itself and lexlean.toml are not."

[[id]]
id = "PF-03"
level = "build"

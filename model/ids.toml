[[id]]
id = "GW-01"
level = "build"
suite = "gateway"
statement = "The gateway declares the ten effects of src/Effects.lex.tex, in order, followed by one frame effect: the host protocol of gateway/src/Application.lex.tex lists the names E1 to E10 that Effects.lex.tex declares at the tags 0 to 9 and then rate.calls at the tag 10, which no core can request, a test holds the first ten equal to the model and names the eleventh, and the declared request of store.get ends with the U32 field view and that of store.put with the U32 field form, the closed fields of EF-09, on the effects they extend and on no other."

[[id]]
id = "GW-02"
level = "build"
suite = "gateway"
statement = "Each effect of the gateway has a typed request, a typed result and a closed list of failures in PrismPM's field kinds, as GATEWAY.md tabulates them: an engine error travels in the result's class and result fields, the refusal of a module by lexlean::sdk travels in the class and the content or rendered field of store.get and store.put, a host fault is one of the declared failures (store.get adds view-unknown and store.put adds form-unknown), and no field or failure is declared that the table does not name."

[[id]]
id = "GW-03"
level = "build"
suite = "gateway"
statement = "The core of the gateway is one LexLean production root, LexLeanMcpGateway.Gateway.gatewayRun, over the sources of UOR-Foundation/MCP at the commit of .github/mcp.rev (the provider effects of MCP#39) and the tool layer, whose functions take the arguments and the effect outcomes of the turn and return a typed outcome: gateway/lexlean.toml has those two source roots, the root declares only the allocation and overflow effects, and the committed export request names the root and its package."


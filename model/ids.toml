level = "build"
suite = "observability"
statement = "The service level indicators are data: one definition for each of S1 to S8 of src/OwnerValues.lex.tex, in the same order and with the same unit, with a distinct metric name and a label set drawn from the ErrorClass, the protocol error code, the outcome and the profile; they are the seven indicators of issue #16 and the signing failure count its alert on signing failures needs."

[[id]]
id = "OB-06"
level = "build"
suite = "observability"
statement = "The alert predicates are total functions of a metric sample whose thresholds are read from the S-values of src/OwnerValues.lex.tex: the alerts on class 2, class 3 and class 70 tool outcomes, on a failed child group end, on a profile drift and on a signing failure each fire on a sample one above the threshold and stay silent on a healthy sample, and the classes 1 and 4 and the ended and already-gone group ends never alert."

[[id]]
id = "OB-07"
level = "build"
suite = "observability"
statement = "The traceparent parser gives, for the examples of W3C Trace Context and for each rule of OB-03, the fields of the header or the typed fault that refuses it: length, separator, digit, forbidden version, zero trace-id and zero parent-id, and it accepts a higher version whose extra fields follow a hyphen and refuses a version 00 header that is longer than 55 characters."

[[id]]
id = "OB-08"
level = "build"
suite = "observability"
statement = "Trace context extraction is a total function of the _meta entries of a request: it gives the parsed traceparent or its typed fault, drops tracestate when the traceparent is absent or refused, carries baggage independently of the traceparent, carries tracestate up to 512 and baggage up to 8192 bytes and drops what is longer, refuses a traceparent that occurs twice or is not text, and ignores every other key."

[[id]]
id = "OB-09"
level = "build"
suite = "observability"
statement = "The server notifications this product can emit are a closed set, the type Emitted with the one constructor Progress, and the kernel checks that no emitted notification is notifications/message and that the emitted methods are notifications/progress alone."

[[id]]
id = "OB-10"
level = "build"
suite = "observability"
statement = "Each theorem of src/Observability.lex.tex that carries a claim rejects its planted defect under lexlean verify: a free-text field kept without redaction, an alert threshold off by one, a malformed traceparent accepted, a tracestate kept after a refused traceparent, and notifications/message added to the emitted set; OBSERVABILITY.md records the command, the diagnostic and the restore of each."

[[id]]
id = "PF-01"
level = "build"
suite = "profiles"
statement = "The profile identity is Identity.profileId over the profile files and the domain tag is the issue's: the 22 octets of the tag lexlean-mcp-profile-v1 are the profile domain that Identity frames first, and the identity of a project is the SHA-256 of the framed domain, the sorted (path, bytes) rows of the files outside the source roots, the review records and the toolchain."

[[id]]
id = "PF-02"
level = "build"
suite = "profiles"
statement = "A path is under a source root exactly when it is the root, one separator and more: roots match whole components, so src/Main.lex.tex and src/deep/Other.lex.tex are under the root src, while srcs/Main.lex.tex, the path src itself and lexlean.toml are not."

[[id]]
id = "PF-03"
level = "build"
suite = "profiles"
statement = "Changing the bytes of any profile file, one of lexlean.toml, lexlean.lock, a file of a local lexicon package or an artifact_source file, renaming a profile file, adding one and removing one each give another profile ID, as do a file under a directory that only looks like a source root and a file named like the root."

[[id]]
id = "PF-04"
level = "build"
suite = "profiles"
statement = "A file under a source root is not a profile file: the profile file set drops it, and for every other file list, review list and toolchain the profile ID with that file equals the profile ID without it."

[[id]]
id = "PF-05"
level = "build"
suite = "profiles"
statement = "The order of the rows does not change the profile ID: four reorderings of the four profile files, one of them with a source file added, give the ID of the original order, and a repeated path is refused with DuplicatePath."

[[id]]
id = "PF-06"
level = "build"
suite = "profiles"
statement = "A profile has one language: a package of the profile's language is admitted and a package of another language is refused with LLC0103, for each of the nine pairs of the languages 1.0, 1.1 and 1.2 that the owner values admit; the first refusal of a package list is the answer, and the code is the one the pinned LexLean returns for a lexicon whose language does not match the project's."

[[id]]
id = "PF-07"
level = "some-true"
suite = "profiles"
statement = "The Atlas lexicon lexlean.uor.atlas@1.0.0 of the pinned LexLean is language 1.0 and holds 293 entry files with distinct ids, each a document denotation into the module Atlas, and the project examples/uor-atlas holds 86 source modules, all core modules, 80 at the top and 6 under Prelude, that include the module Atlas; the model's package, version, language, counts, entry ids and module names equal that copy."

[[id]]
id = "PF-08"
level = "build"
suite = "profiles"
statement = "An Atlas profile serves all 293 entries: every entry denotes the module Atlas, the module Atlas is among the 86 modules of the profile, and the number of served entries is 293; without the module Atlas no entry is served, an entry into a module the profile lacks is not served, and the owner values give the uor-atlas profile the language 1.0, so a package of language 1.2 is refused with LLC0103."

[[id]]
id = "PF-09"
level = "build"
suite = "profiles"
statement = "Each law of the profile model rejects its planted defect: a root that matches a prefix instead of a whole component, a profile file set that keeps source files, a serve check that counts an entry into a missing module and a language rule that admits another language each fail lexlean verify; PROFILES.md records the command, the diagnostic and the restore of each."

[[id]]
id = "GW-01"
level = "build"
suite = "gateway"
statement = "The gateway declares the ten effects of src/Effects.lex.tex, in order, followed by one frame effect: the host protocol of gateway/src/Application.lex.tex lists the names E1 to E10 that Effects.lex.tex declares at the tags 0 to 9 and then rate.calls at the tag 10, which no core can request, and a test holds the first ten equal to the model and names the eleventh."

[[id]]
id = "GW-02"
level = "build"
suite = "gateway"
statement = "Each effect of the gateway has a typed request, a typed result and a closed list of failures in PrismPM's field kinds, as GATEWAY.md tabulates them: an engine error travels in the result's class and result fields, a host fault is one of the declared failures, and no field or failure is declared that the table does not name."

[[id]]
id = "GW-03"
level = "build"
suite = "gateway"
statement = "The core of the gateway is one LexLean production root, LexLeanMcpGateway.Gateway.gatewayRun, over the sources of UOR-Foundation/MCP at the commit of .github/mcp.rev (the provider effects of MCP#39) and the tool layer, whose functions take the arguments and the effect outcomes of the turn and return a typed outcome: gateway/lexlean.toml has those two source roots, the root declares only the allocation and overflow effects, and the committed export request names the root and its package."

[[id]]
id = "GW-04"
level = "build"
suite = "gateway"
statement = "Every effect is exercised by an acceptance vector of the gateway: the transcripts of the declaration request each of E1 to E10, each from a vector whose tool call is one of gateway/vectors/exchanges.json, and the vectors that request no effect are the invalid, unknown and listing calls."

[[id]]
id = "GW-05"
level = "build"
suite = "gateway"
statement = "No effect outside E1 to E10 can be encoded by the core: the model's decoder refuses the tag of the frame effect and every other tag past the set, the generated tables mark exactly the tags 0 to 9 as the core's (the Request sum decodes eleven tags and refuses every other with an undeclared effect), and negative tests of the binding crate assert the tag 10 is not the core's and the first and the largest tag past the eleven are refused."

[[id]]
id = "GW-06"
level = "build"
suite = "gateway"
statement = "Tool names and MCP method names occur nowhere in host adapter source (Q6): the names of the tools of gateway/src and the methods of the MCP sources at the pin do not occur in gateway/bindings, and, in the gateway job, not in the generated host-api and host crates either, except the one method the application declares as the counted value of its frame section, which the generated serving surface carries."

[[id]]
id = "GW-07"
level = "build"
suite = "gateway"
statement = "The binding implements each of the ten host effects with a real effect and holds no dispatch: the store on the filesystem with refused keys, the four Engine calls, the verifier process of a task, the lexicon and the attestation reads, each with a test of its success and of each failure it declares."

[[id]]
id = "GW-08"
level = "build"
suite = "gateway"
statement = "prismpm build and prismpm verify accept the gateway: the build produces the core and the two host packages, the core package equals the committed export, and verify replays every vector through the binding and exercises all ten effects; GATEWAY.md records each planted defect, the failing command and the diagnostic."

[[id]]
id = "GW-09"
level = "build"
suite = "gateway"
statement = "The gateway builds without a published crate: gateway/registry.sh assembles a directory source for the gateway workspace from the pinned commits with cargo package, records the SHA-256 of each package it makes and compares it with a fresh package, no manifest has a path or Git dependency, deny.toml admits crates.io only, and CI.md states the release step that removes the replacement."

[[id]]
id = "GW-10"
level = "build"
suite = "gateway"
statement = "The rate counter is a frame effect and not a constant: the declaration has the effect rate.calls (request: counted, result: calls), the serving frame section tool_calls takes the field calls of its result, the adapter and not the core requests it once for every request that reaches the core, EFFECTS.md records that it is outside the ten effects the core can encode, and a test holds that the model's decoder refuses its tag."

[[id]]
id = "GW-11"
level = "build"
suite = "gateway"
statement = "The MCP modules laid out under gateway/mcp are those of the pin: every laid-out source file and lexicon file equals the file of UOR-Foundation/MCP at .github/mcp.rev byte for byte, and the lexicon package mcp.core has in gateway/lexlean.lock the tree hash that MCP's lexlean.lock at the pin records for it, which restates AC-03 for a gateway that cannot carry the fixture core's digest."

[[id]]
id = "TL-01"
level = "build"
suite = "tools"
statement = "The tools of F4 to F7 declare one schema each: lexlean_check, lexlean_snapshot, lexlean_format and lexlean_build take project (a non-empty string), files (strings) and all (a boolean), lexlean_format also check_only, and no other member; each declares an outputSchema, the lexlean/command-result/1 object for check, format and build and an object with a spec for snapshot; tools/list through the production core shows exactly these, and a call whose arguments break the schema is refused by the core as an Invalid arguments error result before any effect is asked for, while a call the schema admits and the tool cannot make (all together with files, a file name with a line feed) is the protocol error invalid params, and neither is ever an answer of the Engine."

[[id]]
id = "TL-02"
level = "build"
suite = "tools"
statement = "An answer of the Engine is a tool result and never a protocol error: class 0 gives a result without isError whose structuredContent is the canonical command result, classes 1, 2 and 4 give isError true with the command result of the failure, the text block is the same JSON, a host failure (project-refused, engine-unavailable) gives isError true with its failure name, and bytes that are not a command result or whose exit_code differs from the class are a typed internal refusal of the core."

[[id]]
id = "TL-03"
level = "build"
suite = "tools"
statement = "AC-07: for every check fixture that issue #10 puts in F4 and for the build fixture of F7 in tests/negative of the LexLean commit of gateway/mcp/lexlean.rev, lexlean_check and lexlean_build give what lexlean --diagnostic-format json check and build give for the same project: the same exit code and class, the same diagnostics, the same bytes in the text block, and the same files in the project afterwards; the test runs the CLI and the tool, and the fixtures it runs are the F4 and F7 rows of the register plus the names the register lacks."

[[id]]
id = "TL-04"
level = "build"
suite = "tools"
statement = "lexlean_snapshot on the same fixtures agrees with the CLI: a refused project gives the command result that lexlean check gives with command snapshot, an accepted one gives a semantic snapshot whose source_id and semantic_id are those lexlean check prints, and the bytes of the result are the canonical bytes of the Engine's snapshot."

[[id]]
id = "TL-05"
level = "build"
suite = "tools"
statement = "lexlean_format agrees with lexlean fmt: on the same fixtures check_only true gives the result of lexlean fmt --check and writes nothing, and check_only false gives the result of lexlean fmt and leaves the project with the same files, byte for byte."

[[id]]
id = "TL-06"
level = "build"
suite = "tools"
statement = "AC-04: each project of examples/ of the LexLean commit of gateway/mcp/lexlean.rev, with its configuration, lock, local packages and artifact sources, builds through lexlean_build to the tree of its expected/ directory byte for byte (the process-bound files by presence), and the build is the one lexlean build makes."

[[id]]
id = "TL-07"
level = "build"
suite = "tools"
statement = "AC-08: a draft with an atom outside the profile gives, through lexlean_check, an isError result with the diagnostic LLL1004 and its span (path, byte range, line and column), the same as the CLI gives."

[[id]]
id = "TL-08"
level = "build"
suite = "tools"
statement = "Q4: lexlean_check, lexlean_snapshot, lexlean_format and lexlean_build start no child process: the host process accounting (the waited-for children of /proc/self/stat and the live children of every thread) does not move across a call of each, in a test binary in which nothing else spawns, and the same instrument sees a child that a control spawns."

[[id]]
id = "TL-09"
level = "build"
suite = "tools"
statement = "Each gate of the tools rejects its planted defect: a class mapped to the wrong exit code, a diagnostic dropped from a result, and a format whose bytes differ from the CLI's; TOOLS.md records the command, the diagnostic and the restore of each."

[[id]]
id = "GW-12"
level = "build"
suite = "gateway"
statement = "The gateway passes the pinned server conformance suite of UOR-Foundation/MCP with its own exact waiting list (AC-03 part b): the gateway job serves the built gateway-host on loopback and runs the server-suite.mjs and the schema-oracle.mjs of the MCP checkout at .github/mcp.rev (reused, never copied) over it, against the suite commit that MCP pins; gateway/waiting.json names every scenario that does not pass, each with the lexlean-mcp issue or pull request that would deliver it, and the job passes only when the failing scenarios equal that list (an unlisted failure, a stale entry and an entry without an issue each fail it); the lifecycle, transport, header, DNS-rebinding, caching and schema scenarios are not listed and must pass, and no fixture tool is added to the catalogue; GATEWAY-CONFORMANCE.md records the run per scenario with the reason for every waiting entry and the planted defects; a test that needs node or the installed suite is ignored in the workspace gate and the job runs it with --ignored and a count check (the pattern of MCP CF-08)."

[[id]]
id = "TL-10"
level = "build"
suite = "tools"
statement = "lexlean_explain (F11) is declared with one input, code (a string, any string), no other member, and an outputSchema that is the lexlean/command-result/1 object with command explain; tools/list through the production core shows it; a call to it asks the host for no effect, because an explanation is a pure function of the code that is compiled into the core, so src/Effects.lex.tex and the set E1 to E10 do not change; and a call that breaks the schema is refused by the core as an Invalid arguments error result before the tool runs."

[[id]]
id = "TL-11"
level = "build"
suite = "tools"
statement = "The explanations compiled into the core are the rendering of the registry: gateway/src/Explain.lex.tex is what gateway/explain/generate.py renders from model/errors.toml of the LexLean commit of gateway/mcp/lexlean.rev, with one entry for every registered code and none other, the gateway job fails when the committed module is not that rendering, and the tool layer holds no explanation text of its own."

[[id]]
id = "TL-12"
level = "build"
suite = "tools"
statement = "For every code that the registry of the LexLean commit of gateway/mcp/lexlean.rev registers, lexlean_explain gives what lexlean --diagnostic-format json explain gives: a result without isError whose text is the CLI's standard output byte for byte and whose structuredContent is its parse; and for every string the registry does not register (the empty string, a code in another case, quotes, backslashes, control characters, non-ASCII, a code that begins with a dash, which the CLI reads after --) it gives the CLI's refusal: isError true, exit_code 2, the diagnostic LLC0001 that quotes the string, the same bytes; the codes are read from the registry and not typed, and their count is asserted."

[[id]]
id = "TL-13"
level = "build"
suite = "tools"
statement = "Q8, the running clause: every diagnostic code that appears in the result of lexlean_check or lexlean_build on the fixtures of TL-03 resolves through lexlean_explain to the entry the CLI prints for it, and the test counts the distinct codes it resolved."

[[id]]
id = "TL-14"
level = "build"
suite = "tools"
statement = "Each gate of lexlean_explain rejects its planted defect: a wrong byte in an explanation, an unregistered code answered as registered, and an unknown code quoted with an escape that differs from the CLI's; TOOLS.md records the command, the diagnostic and the restore of each."

[[id]]
id = "GW-13"
level = "build"
suite = "gateway"
statement = "The adapter refuses a foreign Origin by itself, independently of the core's own check: over a real socket the generated served adapter answers each origin of a pinned foreign corpus with 403 and the body OriginForbidden, which is the adapter's word and not the core's, and the core is never called; a request with an allowed origin reaches the core; the declaration's origins are exactly http and https over localhost, 127.0.0.1 and [::1] with any port; and GATEWAY.md records the planted widened allow-list, the failing command and the diagnostic."

# model/ids.toml --- the conformance ID register.
#
# Every ID this repository claims, in one place, so that nothing is referenced
# without being defined. `CONFORMANCE.md` is generated from this file. A test
# whose name ends in an ID not listed here fails `check-model`, and an ID listed
# here with no scenario and no test fails it too (CM-02).
#
# `level` is the honesty level (R2):
#   some-true  a fact reproduced from an authority; not established here
#   build      constructed here and validated against its oracle
#   open       measured and reported, never asserted
#
# Every row here has a scenario in `features/suites/` and a test whose name ends
# in the ID, lowercased with underscores (R3, CM-02). There is no "pending"
# state: a capability that is not built does not get a row, and every row in this
# file is built.
#
# The Unicode normalization decision (issue #25) is the first capability
# registered: NF-01..NF-13. Draft admission as loops, exported as a production
# root (issue #9, F3), registers DL-01..DL-04. Canonical ordering by a stable
# merge sort (issue #9, item 2 of the second finding) registers NF-14 and NF-15.
# The first executed measurement of the threat model (issue #14, R5) registers SM-01.
# The AC-07 fixture register (issue #10) registers FX-01 to FX-08: two rows that
# reproduce the negative fixtures of the pinned LexLean and six that are checked here.
# The owner-set values of issue #19 register OV-01..OV-03.
# The observability model of issue #16 registers OB-01..OB-10: three rows that reproduce
# LexLean, MCP and W3C facts and seven that are checked here.

spec = "template/1"

[[id]]
id = "NF-01"
level = "build"
suite = "nfc"
statement = "The pinned Unicode Character Database files (UnicodeData.txt, CompositionExclusions.txt, DerivedNormalizationProps.txt, NormalizationTest.txt) are the Unicode 17.0.0 files whose SHA-256 digests the authorities record, and 17.0.0 is the Unicode version of unicode-normalization 0.1.25, the crate LexLean release/v0.4 at 9796067 pins."

[[id]]
id = "NF-02"
level = "build"
suite = "nfc"
statement = "The committed artifacts/nfc-tables-low.bin, artifacts/nfc-tables-high.bin, artifacts/nfc-sample.bin and src/NfcTables.lex.tex equal, byte for byte, a fresh generation from the pinned files, and the SHA-256 of each artifact equals the digest in its artifact declaration and in lexlean.toml."

[[id]]
id = "NF-03"
level = "build"
suite = "nfc"
statement = "The LexLean decision answers every line of the pinned NormalizationTest.txt as the file's own invariants state: the c2 and c4 columns are NFC, each of the c1 and c3 columns is NFC exactly when it equals c2, and the c5 column is NFC exactly when it equals c4."

[[id]]
id = "NF-04"
level = "build"
suite = "nfc"
statement = "For every line of the pinned NormalizationTest.txt, the LexLean canonical decomposition with canonical ordering maps c1, c2 and c3 to c3 and c4 and c5 to c5, and the LexLean NFC maps c1, c2 and c3 to c2 and c4 and c5 to c4."

[[id]]
id = "NF-05"
level = "build"
suite = "nfc"
statement = "Every code point assigned in the pinned UnicodeData.txt that is not a c1 of Part 1 of NormalizationTest.txt is NFC and is its own NFC and its own canonical decomposition, as the file's conformance clause 2 requires."

[[id]]
id = "NF-06"
level = "build"
suite = "nfc"
statement = "The LexLean UTF-8 reader returns the scalar value of every Unicode scalar value from its standard UTF-8 encoding."

[[id]]
id = "NF-07"
level = "build"
suite = "nfc"
statement = "The oracle executes the packages exported from the LexLean roots nfcRun and admitRun, whose recorded digests and compiler semantics ID match the committed files and lexlean.lock."

[[id]]
id = "NF-08"
level = "build"
suite = "nfc"
statement = "The LexLean decision agrees with unicode-normalization 0.1.25 on every line of the pinned NormalizationTest.txt and on every scalar value; the crate is a cross-check and never the authority."

[[id]]
id = "NF-09"
level = "build"
suite = "nfc"
statement = "Path admission refuses a path that is valid UTF-8 and not NFC with the typed refusal NotNfc after UTF-8 validation and before the root and suffix checks, and admits an NFC path; the instances are kernel-checked by lexlean verify."

[[id]]
id = "NF-10"
level = "build"
suite = "nfc"
statement = "The fast bound the generator derives from the pinned files is the least code point that has a nonzero combining class, is in Full_Composition_Exclusion or is the second code point of a canonical pair; the LexLean decision judges every string of two code points below it to be NFC, as unicode-normalization 0.1.25 does, and decomposesFrom is the least code point with a canonical decomposition."

[[id]]
id = "NF-11"
level = "build"
suite = "nfc"
statement = "Every kernel-checked instance stated in src/Nfc.lex.tex on the sample image holds, with the same value, when the exported LexLean decision runs it on the full tables."

[[id]]
id = "NF-12"
level = "build"
suite = "nfc"
statement = "Path admission through the exported LexLean root admitRun on the full tables refuses e followed by U+0301 as NotNfc and admits U+00E9, refuses invalid UTF-8 as NotUtf8 before NFC, refuses a non-NFC path as NotNfc before the root and suffix checks, and agrees with the order of the kernel-checked instances of src/Admission.lex.tex."

[[id]]
id = "NF-13"
level = "build"
suite = "nfc"
statement = "The exported roots nfcRun and admitRun declare no recursion effect, and run a path of one MiB of scalars on a two MiB thread stack with a typed result: no stage recurses to a depth bounded by the input."

[[id]]
id = "NF-14"
level = "build"
suite = "nfc"
statement = "Canonical ordering sorts each run of non-starters by combining class with a stable merge sort, so the cost of the NFC decision in a run of n combining marks is O(n log n): through the exported roots nfcRun and admitRun on a two MiB thread stack, a run of 10^6 combining marks of cyclically descending class, a run of 10^6 marks in ascending class order and a run of 10^6 marks of one class are each decided within a stated time bound, with the NFD, the NFC, the NFC verdict and the path verdict that unicode-normalization 0.1.25 gives, and the NFD of the run of one class keeps the order of its marks."

[[id]]
id = "NF-15"
level = "build"
suite = "nfc"
statement = "Canonical ordering exchanges only marks whose combining classes are strictly out of order, so marks of equal class keep their order: the kernel-checked instances of src/Nfc.lex.tex state it, and the exported decision gives the NFD and the NFC of unicode-normalization 0.1.25 on every one of 20000 pseudo-random strings of starters and marks drawn from few classes with several marks in each."

[[id]]
id = "DL-01"
level = "build"
suite = "draft"
statement = "The exported root admitDraftRun declares no recursion effect, its package carries the recorded digests and the compiler semantics ID of lexlean.lock, and the stages of draft admission that run over the rows (rowsStage, the row count, the byte total and the duplicate scan) are executable definitions of src/Admission.lex.tex."

[[id]]
id = "DL-02"
level = "build"
suite = "draft"
statement = "The exported root admitDraftRun runs on a two MiB thread stack with a typed result for a draft of one million rows: it refuses the draft as TooManyFiles under a small maxFiles, admits a draft whose row count equals maxFiles and whose bytes equal maxBytes, refuses a draft one byte past maxBytes as TooManyBytes, and refuses a draft with a duplicate path as DuplicatePath."

[[id]]
id = "DL-03"
level = "build"
suite = "draft"
statement = "Draft admission through the exported root admitDraftRun on the full tables gives the verdicts of the kernel-checked instances of admitDraft, with the refusal named by the constructor order of Refusal, and decides in this order: the path refusals of the rows in row order, then TooManyFiles, then TooManyBytes, then DuplicatePath."

[[id]]
id = "DL-04"
level = "build"
suite = "draft"
statement = "The duplicate scan of draft admission sorts the paths and compares neighbours, so it makes no pairwise comparison of rows: through the exported root admitDraftRun on a two MiB thread stack, a draft of one million rows whose paths are in no sorted order is admitted within a stated time bound, and the same draft with one repeated path is refused as DuplicatePath within the same bound."

[[id]]
id = "SM-01"
level = "build"
suite = "security"
statement = "The measurement of R5 (path escape) is executed by NF-09, NF-12, DL-01, DL-02, DL-03 and DL-04, whose tests pass, and Security records it as Executed; the symlink clause stays Pending on #9."

[[id]]
id = "FX-01"
level = "some-true"
suite = "fixtures"
statement = "LexLean release/v0.4 at 9796067 (commit 97960679736e960e84a98f5c43981e1f2c70d6d7) holds in tests/negative the git tree 200e4d920b5efae7d34915c617c75f8c0cb46864 with 297 fixtures, of which 256 run the command check, 1 build, 32 verify, 4 lock and 4 production."

[[id]]
id = "FX-02"
level = "some-true"
suite = "fixtures"
statement = "The expected result of each fixture, expected/command.json, is the canonical command result (lexlean/command-result/1) that the LexLean CLI of that commit gives for the project of the fixture, as the check-fixtures gate of LexLean decides; this repository records the results and runs no command."

[[id]]
id = "FX-03"
level = "build"
suite = "fixtures"
statement = "The files vendored under crates/negative-fixtures/lexlean are the case.toml and the expected files of the pinned tests/negative: each has the SHA-256 the register records, the git trees recomputed from the vendored files and the recorded trees of the project directories are the recorded trees of the fixtures and the pinned tree of tests/negative, and the checksum of the authority covers every vendored file."

[[id]]
id = "FX-04"
level = "build"
suite = "fixtures"
statement = "Every row of the register is what the vendored bytes give: the command of case.toml, the exit status and the diagnostic codes of the canonical command result, and the digests of both files, with the exit status of case.toml equal to that of the result."

[[id]]
id = "FX-05"
level = "build"
suite = "fixtures"
statement = "Every fixture of the pinned tree is classified exactly once: no name is listed twice, the register and the vendored directories name the same fixtures, and a fixture is F4 when it runs check, F7 when it runs build, #11 when it runs verify, and excluded when issue #10 leaves it out."

[[id]]
id = "FX-06"
level = "build"
suite = "fixtures"
statement = "The register has 297 fixtures: 252 for F4, 1 for F7, 32 for #11 and 12 excluded, so 285 reach a tool; every sum is recomputed from the rows, so a hand edit of a row or of a sum fails."

[[id]]
id = "FX-07"
level = "build"
suite = "fixtures"
statement = "The excluded fixtures are the twelve that issue #10 names, each with the reason it gives, and no other: 2 for CLI argument parsing, 2 for symlinks, 4 for setup and 4 for being outside the product."

[[id]]
id = "FX-08"
level = "build"
suite = "fixtures"
statement = "Each gate of the register rejects its planted defect: a fixture reclassified, a digest altered, a vendored byte altered or removed, an exclusion without a reason, an exclusion the issue does not make, a name listed twice and a fixture missing; FIXTURES.md records the command, the diagnostic and the restore of each."

[[id]]
id = "OV-01"
level = "build"
suite = "owner-values"
statement = "No model declaration depends on an unset owner value: the product version, the signing key and request-state-key custody and rotation, every parameter, the retention, the cache time to live, the listen port, the service level objectives and the profile set are bound in src/Product.lex.tex and src/OwnerValues.lex.tex, the ten risk likelihoods are Foundation.Sec.Likelihood constructors in src/Security.lex.tex, and no source applies the Unbound constructor of OwnerValue."

[[id]]
id = "OV-02"
level = "build"
suite = "owner-values"
statement = "OWNER-VALUES.md and the model state the same value for every owner-set value, in both directions: every row of the proposal table is bound in the model with the same value, every value the model binds has a row, and every row names its evidence, its decider, its status and what changes if it moves."

[[id]]
id = "OV-03"
level = "build"
suite = "owner-values"
statement = "Each bound value respects the constraint it follows from: draft.max_bytes and draft.max_files hold the largest example and stay within the limits of lexlean.toml, verify.concurrency times verify.memory_kib fits a 16 GiB host, verify.width is within the range of LexLean SPEC 22.11, listen.port is a registered-range port below the ephemeral range, and the product version equals the workspace package version."

[[id]]
id = "OB-01"
level = "some-true"
suite = "observability"
statement = "LexLean release/v0.4 at 9796067 maps the five variants of ErrorClass, Language, CliOrConfiguration, Environment, SecurityOrLimit and Internal, to the CLI exit codes 1, 2, 3, 4 and 70 (SPEC 24.5 and 23.6), so that the classes 2, 3 and 70 of issue #16 are CliOrConfiguration, Environment and Internal."

[[id]]
id = "OB-02"
level = "some-true"
suite = "observability"
statement = "The ServerNotification union of the MCP schema 2026-07-28 has eight methods: notifications/cancelled, notifications/progress, notifications/resources/list_changed, notifications/subscriptions/acknowledged, notifications/resources/updated, notifications/prompts/list_changed, notifications/tools/list_changed and notifications/message, the last being the log message a client opts into through the io.modelcontextprotocol/logLevel key of a request's _meta."

[[id]]
id = "OB-03"
level = "some-true"
suite = "observability"
statement = "W3C Trace Context Level 1 defines traceparent as a two-digit version, a 32-digit trace-id, a 16-digit parent-id and a two-digit trace-flags in lowercase hexadecimal joined by hyphens, forbids version ff and an all-zero trace-id or parent-id, tells a vendor that fails to parse traceparent to ignore it and not to attempt tracestate, and lets a vendor parse a higher version from its first 55 characters; W3C Baggage requires a platform to propagate a baggage-string of at most 64 list-members and 8192 bytes."

[[id]]
id = "OB-04"
level = "build"
suite = "observability"
statement = "A telemetry record holds no module text and no lexicon search query, by its types: the free-text fields of the log record and the span record, the log body, the tool arguments, the search query and the status text, have the type Redacted, whose only value is Withheld, and the kernel checks that Redacted has one value, that redaction ignores its text, and that for every input the record built from it is the same record whatever text its free-text fields carry."

[[id]]
id = "OB-05"
level = "build"
suite = "observability"
statement = "The service level indicators are data: one definition for each of S1 to S8 of src/OwnerValues.lex.tex, in the same order and with the same unit, with a distinct metric name and a label set drawn from the ErrorClass, the protocol error code, the outcome and the profile; they are the seven indicators of issue #16 and the signing failure count its alert on signing failures needs."

[[id]]
id = "OB-06"
level = "build"
suite = "observability"
statement = "The alert predicates are total functions of a metric sample whose thresholds are read from the S-values of src/OwnerValues.lex.tex: the alerts on class 2, class 3 and class 70 tool outcomes, on a failed child group end, on a profile drift and on a signing failure each fire on a sample one above the threshold and stay silent on a healthy sample, and the classes 1 and 4 and the ended and already-gone group ends never alert."

[[id]]
id = "OB-07"
level = "build"
suite = "observability"
statement = "The traceparent parser gives, for the examples of W3C Trace Context and for each rule of OB-03, the fields of the header or the typed fault that refuses it: length, separator, digit, forbidden version, zero trace-id and zero parent-id, and it accepts a higher version whose extra fields follow a hyphen and refuses a version 00 header that is longer than 55 characters."

[[id]]
id = "OB-08"
level = "build"
suite = "observability"
statement = "Trace context extraction is a total function of the _meta entries of a request: it gives the parsed traceparent or its typed fault, drops tracestate when the traceparent is absent or refused, carries baggage independently of the traceparent, carries tracestate up to 512 and baggage up to 8192 bytes and drops what is longer, refuses a traceparent that occurs twice or is not text, and ignores every other key."

[[id]]
id = "OB-09"
level = "build"
suite = "observability"
statement = "The server notifications this product can emit are a closed set, the type Emitted with the one constructor Progress, and the kernel checks that no emitted notification is notifications/message and that the emitted methods are notifications/progress alone."

[[id]]
id = "OB-10"
level = "build"
suite = "observability"
statement = "Each theorem of src/Observability.lex.tex that carries a claim rejects its planted defect under lexlean verify: a free-text field kept without redaction, an alert threshold off by one, a malformed traceparent accepted, a tracestate kept after a refused traceparent, and notifications/message added to the emitted set; OBSERVABILITY.md records the command, the diagnostic and the restore of each."

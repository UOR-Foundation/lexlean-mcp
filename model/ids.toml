[[id]]
id = "PF-06"
level = "build"
suite = "profiles"
statement = "A profile has one language: a package of the profile's language is admitted and a package of another language is refused with LLC0103, for each of the nine pairs of the languages 1.0, 1.1 and 1.2 that the owner values admit; the first refusal of a package list is the answer, and the code is the one the pinned LexLean returns for a lexicon whose language does not match the project's."

[[id]]

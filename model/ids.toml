level = "some-true"
suite = "profiles"
statement = "The Atlas lexicon lexlean.uor.atlas@1.0.0 of the pinned LexLean is language 1.0 and holds 293 entry files with distinct ids, each a document denotation into the module Atlas, and the project examples/uor-atlas holds 86 source modules, all core modules, 80 at the top and 6 under Prelude, that include the module Atlas; the model's package, version, language, counts, entry ids and module names equal that copy."


statement = "The profile identity is Identity.profileId over the profile files and the domain tag is the issue's: the 22 octets of the tag lexlean-mcp-profile-v1 are the profile domain that Identity frames first, and the identity of a project is the SHA-256 of the framed domain, the sorted (path, bytes) rows of the files outside the source roots, the review records and the toolchain."

[[id]]

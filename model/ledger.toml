# model/ledger.toml --- the honesty ledger for claims that are not conformance
# IDs (R2).
#
# The conformance IDs and their levels live in `model/ids.toml`, which is the
# register; duplicating them here would give a claim two sources, which is
# exactly what R1 forbids. What remains is the two kinds of claim that have no
# ID: the facts this repository *reproduces* from an authority, and the
# quantities it *measures* and never asserts.
#
# The meta-gate proves the suite never asserts an `open` claim as established,
# and `CM-03` proves every `some-true` row cites an authority that exists.
#
# The claims below are facts the NFC decision reproduces from the standard, the
# database files and the crate it cites, and facts the fixture register reproduces
# from the negative fixtures of the pinned LexLean, and the facts the measures of Q2 and Q8 reproduce
# from its public API and its diagnostic registry; the level of each is some-true.

spec = "template/1"

claim = [
  { id = "AUTH-01", level = "some-true", statement = "UAX #15 defines NFC as canonical decomposition, canonical ordering, then canonical composition with the composition exclusions.", authority = "A-UAX15" },
  { id = "AUTH-02", level = "some-true", statement = "The pinned UnicodeData.txt gives the combining class and canonical decomposition of every assigned code point of Unicode 17.0.0.", authority = "A-UCD-UNICODEDATA" },
  { id = "AUTH-03", level = "some-true", statement = "The pinned CompositionExclusions.txt lists the script-specific and post-composition-version composition exclusions.", authority = "A-UCD-COMPOSITIONEXCLUSIONS" },
  { id = "AUTH-06", level = "some-true", statement = "The pinned DerivedNormalizationProps.txt gives Full_Composition_Exclusion, the code points canonical composition never produces.", authority = "A-UCD-DERIVEDNORMALIZATIONPROPS" },
  { id = "AUTH-04", level = "some-true", statement = "The pinned NormalizationTest.txt states the invariants a conformant normalization satisfies on each of its lines.", authority = "A-UCD-NORMALIZATIONTEST" },
  { id = "AUTH-05", level = "some-true", statement = "unicode-normalization 0.1.25 implements Unicode 17.0.0, and LexLean v0.4.0 at `e0b74b8` pins it.", authority = "A-UNICODE-NORMALIZATION" },
  { id = "AUTH-07", level = "some-true", statement = "LexLean v0.4.0 at `e0b74b8` holds 298 fixtures in tests/negative, the git tree f5a43991dec0c604c8647c5dd050f183a16832a6.", authority = "A-LEXLEAN-NEGATIVE" },
  { id = "AUTH-08", level = "some-true", statement = "The expected/command.json of each of those fixtures is the canonical command result the LexLean CLI of that commit gives for the project of the fixture.", authority = "A-LEXLEAN-NEGATIVE" },
  { id = "AUTH-09", level = "some-true", statement = "The stable API surface of LexLean v0.4.0 at `e0b74b8` is the 33 public functions that crates/lexlean/src/api.rs, api/production.rs, sdk.rs and verify/lifeline.rs declare.", authority = "A-LEXLEAN-API" },
  { id = "AUTH-10", level = "some-true", statement = "LexLean v0.4.0 at `e0b74b8` registers 86 diagnostic codes, and lexlean explain prints the ERRORS.md entry of each.", authority = "A-LEXLEAN-ERRORS" },
  { id = "AUTH-11", level = "some-true", statement = "PrismPM d11ace6f declares a feature and a journey as Foundation.Arch::Feature and Foundation.Arch::Journey and refuses, with PP2014 to PP2018, a feature without a call or an acceptance row, a journey step that names no declared feature, a journey actor that is no declared stakeholder, and a malformed declaration or a call or acceptance row that names no definition.", authority = "A-PRISMPM-ARCH" },
  { id = "AUTH-12", level = "some-true", statement = "LexLean v0.4.0 at `e0b74b8` defines ErrorClass with the variants Language, CliOrConfiguration, Environment, SecurityOrLimit and Internal, which map exactly to the CLI exit codes 1, 2, 3, 4 and 70.", authority = "A-LEXLEAN-SPEC" },
  { id = "AUTH-13", level = "some-true", statement = "The MCP schema 2026-07-28 lists eight server notifications, including notifications/message.", authority = "A-MCP-SCHEMA-2026-07-28" },
  { id = "AUTH-14", level = "some-true", statement = "W3C Trace Context Level 1 gives the grammar and the validity rules of traceparent and the rule that tracestate is not parsed after a traceparent that fails to parse.", authority = "A-W3C-TRACE-CONTEXT" },
  { id = "AUTH-15", level = "some-true", statement = "W3C Baggage gives the minimum limits of 64 list-members and 8192 bytes.", authority = "A-W3C-BAGGAGE" },
  { id = "AUTH-16", level = "some-true", statement = "The lexicon lexlean.uor.atlas@1.0.0 of LexLean v0.4.0 at `e0b74b8` is language 1.0 with 293 entries that are document denotations into the module Atlas, and examples/uor-atlas holds 86 core modules.", authority = "A-LEXLEAN-ATLAS" },
]

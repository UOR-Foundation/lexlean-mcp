# model/authorities.toml --- what this repository cites rather than proves.
#
# A `some-true` claim is reproduced from an authority and is not established
# here. This file is where the authority is named well enough for a third party
# to find it, with a checksum over the committed artifact when there is one and
# a stated reason when there is not.
#
# `realized_by` lists the conformance IDs that are *evidence* this repository
# realizes the cited fact. Evidence is not proof, and the meta-gate fails the
# build if any document blurs the two registers.
#
# The Unicode normalization decision cites the standard it implements, the
# four Unicode Character Database files it is generated from and measured
# against, and the crate whose Unicode version LexLean pins. The fixture
# register (issue #10, AC-07) cites the negative fixtures of the pinned LexLean. The
# measures of Q2 and Q8 (issue #15) cite its public API and its diagnostic registry.

spec = "template/1"

authority = [
  { id = "A-UAX15", name = "Unicode Standard Annex #15: Unicode Normalization Forms", citation = "Unicode Standard Annex #15, Unicode 17.0.0, https://www.unicode.org/reports/tr15/", checksum = "none", checksum_reason = "A published standard; no copy of it is committed here, so there is no artifact to checksum.", statement = "NFC is canonical decomposition, canonical ordering by combining class, then canonical composition under the composition exclusions, with Hangul syllables composed and decomposed by arithmetic; a string is in NFC exactly when it equals its own NFC.", realized_by = ["NF-03", "NF-04", "NF-05"] },
  { id = "A-UCD-UNICODEDATA", name = "UnicodeData.txt of the Unicode Character Database 17.0.0", citation = "Unicode Character Database 17.0.0, https://www.unicode.org/Public/17.0.0/ucd/UnicodeData.txt. The committed copy is the publisher's source repository file, github.com/unicode-org/unicodetools path unicodetools/data/ucd/17.0.0/UnicodeData.txt at commit 578f6c0516f5f268292ebda50b51848407a06478 (byte-identical to the file at that commit); the first line of the file names 17.0.0, and crates/nfc-tables/ucd/README.md records how the copy was shown to be the file unicode-normalization 0.1.25 was generated from.", checksum = "2e1efc1dcb59c575eedf5ccae60f95229f706ee6d031835247d843c11d96470c", checksum_reason = "", statement = "The canonical combining class and the canonical decomposition mapping of every assigned code point, and the assigned code points. The checksum is the SHA-256 of the committed file.", realized_by = ["NF-01", "NF-02", "NF-05"] },
  { id = "A-UCD-COMPOSITIONEXCLUSIONS", name = "CompositionExclusions.txt of the Unicode Character Database 17.0.0", citation = "Unicode Character Database 17.0.0, https://www.unicode.org/Public/17.0.0/ucd/CompositionExclusions.txt. The committed copy is the publisher's source repository file, github.com/unicode-org/unicodetools path unicodetools/data/ucd/17.0.0/CompositionExclusions.txt at commit 578f6c0516f5f268292ebda50b51848407a06478 (byte-identical to the file at that commit); the first line of the file names 17.0.0, and crates/nfc-tables/ucd/README.md records how the copy was shown to be the file unicode-normalization 0.1.25 was generated from.", checksum = "2f239196ef3b5b61db5cc476e9bd80f534d15aa1b74e1be1dea5d042a344c85f", checksum_reason = "", statement = "The script-specific and post-composition-version composition exclusions; the generator checks them against Full_Composition_Exclusion. The checksum is the SHA-256 of the committed file.", realized_by = ["NF-01", "NF-02"] },
  { id = "A-UCD-DERIVEDNORMALIZATIONPROPS", name = "DerivedNormalizationProps.txt of the Unicode Character Database 17.0.0", citation = "Unicode Character Database 17.0.0, https://www.unicode.org/Public/17.0.0/ucd/DerivedNormalizationProps.txt. The committed copy is the publisher's source repository file, github.com/unicode-org/unicodetools path unicodetools/data/ucd/17.0.0/DerivedNormalizationProps.txt at commit 578f6c0516f5f268292ebda50b51848407a06478 (byte-identical to the file at that commit); the first line of the file names 17.0.0, and crates/nfc-tables/ucd/README.md records how the copy was shown to be the file unicode-normalization 0.1.25 was generated from.", checksum = "71fd6a206a2c0cdd41feb6b7f656aa31091db45e9cedc926985d718397f9e488", checksum_reason = "", statement = "The derived property Full_Composition_Exclusion: the code points that never occur in the output of canonical composition. The checksum is the SHA-256 of the committed file.", realized_by = ["NF-01", "NF-02"] },
  { id = "A-UCD-NORMALIZATIONTEST", name = "NormalizationTest.txt of the Unicode Character Database 17.0.0", citation = "Unicode Character Database 17.0.0, https://www.unicode.org/Public/17.0.0/ucd/NormalizationTest.txt. The committed copy is the publisher's source repository file, github.com/unicode-org/unicodetools path unicodetools/data/ucd/17.0.0/NormalizationTest.txt at commit 578f6c0516f5f268292ebda50b51848407a06478 (byte-identical to the file at that commit); the first line of the file names 17.0.0, and crates/nfc-tables/ucd/README.md records how the copy was shown to be the file unicode-normalization 0.1.25 was generated from.", checksum = "5019ffd530751a741900c849c0e010332f142a3612234639bd200b82138a87db", checksum_reason = "", statement = "Five columns per line (source, NFC, NFD, NFKC, NFKD) and the conformance invariants every normalization implementation must satisfy, including the clause for code points the file does not list. The checksum is the SHA-256 of the committed file.", realized_by = ["NF-01", "NF-03", "NF-04", "NF-05"] },
  { id = "A-UNICODE-NORMALIZATION", name = "unicode-normalization 0.1.25", citation = "The Rust crate unicode-normalization 0.1.25 (crates.io), which LexLean release/v0.4 at 9796067 pins in its Cargo.lock; its src/tables.rs states UNICODE_VERSION = (17, 0, 0).", checksum = "5fd4f6878c9cb28d874b009da9e8d183b5abc80117c40bbd187a1fde336be6e8", checksum_reason = "", statement = "LexLean decides NFC with this crate at Unicode 17.0.0. The checksum is the one in LexLean Cargo.lock for the .crate file. Here the crate is a dev-only cross-check of the LexLean decision and the source of the Unicode version, never an authority for the decision.", realized_by = ["NF-01", "NF-08"] },
  { id = "A-LEXLEAN-NEGATIVE", name = "tests/negative of LexLean release/v0.4 at 9796067", citation = "UOR-Foundation/LexLean, directory tests/negative at commit 97960679736e960e84a98f5c43981e1f2c70d6d7 (release/v0.4 at 9796067, the revision .github/lexlean.rev pins), git tree 200e4d920b5efae7d34915c617c75f8c0cb46864; SPEC.md section 28.2 defines the fixture layout (case.toml, expected/, project/). The committed copy under crates/negative-fixtures/lexlean holds, for each of the 297 fixture directories, case.toml and the four files of expected/, byte-identical to the files at that commit; project/ and the toolchain/ and overlay/ directories some fixtures carry are not copied, and crates/negative-fixtures/register.toml records the git tree of each, so the git tree of every fixture directory and of tests/negative is recomputed from this repository. crates/negative-fixtures/README.md records how the copy was made.", checksum = "af966fbb49a7e08bef0f9be29f7359f68371d8449b7b894c53f990419704c94f", checksum_reason = "", statement = "The set of fixtures LexLean decides its negative cases with, and the canonical command result of each. The checksum is the SHA-256 over the lines `<sha256>  <path>` of the 1485 committed files, in byte order of path, with paths relative to crates/negative-fixtures/lexlean.", realized_by = ["FX-01", "FX-02", "FX-03", "FX-04", "FX-05", "FX-06", "FX-07"] },
  { id = "A-LEXLEAN-API", name = "The stable API surface of LexLean release/v0.4 at 9796067", citation = "UOR-Foundation/LexLean at commit 97960679736e960e84a98f5c43981e1f2c70d6d7 (release/v0.4 at 9796067, the revision .github/lexlean.rev pins); SPEC.md sections 24.1, 24.6, 24.7 and 24.8 declare the surface, and the committed copies under crates/quality-map/lexlean are byte-identical to the files at that commit: crates/lexlean/src/api.rs (git blob 2fac21e5cd0f18c59947e212ad2dc1626475d925), crates/lexlean/src/api/production.rs (git blob cc8bcefb7d8767811c1a0c6bcb9b2ce1f96c17ad), crates/lexlean/src/sdk.rs (git blob 55f53e7960062c627b25a79945c5b372584af66f) and crates/lexlean/src/verify/lifeline.rs (git blob 841038b749ca8ec4257498ea1c22e4810078ccc5). crates/quality-map/sources.toml records the blob id, SHA-256 and length of each, and crates/quality-map/README.md records how the copy was made.", checksum = "e718e8e7de11de14ca3c437fd615c8f61738ed9326dc4e1c66523d38bbe6adc1", checksum_reason = "", statement = "The public functions of the stable surface are the 33 that those four files declare with pub fn: the methods of Engine, the functions of lexlean::sdk, the functions and methods of lexlean::api::production, the free functions of lexlean::api, and the two lifecycle functions of lexlean::verify that SPEC 24.6 declares. The checksum is the SHA-256 over the lines `<sha256>  <path>` of the four committed files, in byte order of path, with paths relative to crates/quality-map/lexlean.", realized_by = ["QM-01", "QM-02", "QM-03"] },
  { id = "A-LEXLEAN-ERRORS", name = "The diagnostic registry of LexLean release/v0.4 at 9796067", citation = "UOR-Foundation/LexLean at commit 97960679736e960e84a98f5c43981e1f2c70d6d7 (release/v0.4 at 9796067, the revision .github/lexlean.rev pins); SPEC.md section 26 defines the registry and section 23.4 the explain command; the committed copies under crates/quality-map/lexlean are byte-identical to the files at that commit: model/errors.toml (git blob be2aea77a40f28bebdb0d6d168d08f84676e83ce) and ERRORS.md (git blob 9a995e313f5fb8fcbddda5dc185c229ce13592b5). crates/quality-map/sources.toml records the blob id, SHA-256 and length of each.", checksum = "77ae7932ffaf4637706e44e5a61518c48421d8bda1c2bea7cdaef79df0117873", checksum_reason = "", statement = "The closed registry holds 86 diagnostic codes, each with a class, an exit status, a title and a statement; ERRORS.md is generated from it with one entry per code, and lexlean explain prints that entry (the lexlean binary of the pinned commit prints each of the 86 entries byte for byte, observed once and recorded in QUALITY.md, not a gate). The checksum is the SHA-256 over the lines `<sha256>  <path>` of the two committed files, in byte order of path, with paths relative to crates/quality-map/lexlean.", realized_by = ["QM-04", "QM-05", "QM-06"] },
]
